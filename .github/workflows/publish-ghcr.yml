name: publish-ghcr

# 多服务仓库：逐个服务构建镜像并推送到 GitHub Container Registry (ghcr.io)，
# 推完各自跑一次冒烟。图片名规则: ghcr.io/cjx0712/<repo>-<service>
#
# Author: 晨星

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, push, run (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: collab-core, context: ".", dockerfile: docker/Dockerfile.service, buildargs: "APP=collab-core"}
          - {name: ai-gateway, context: ".", dockerfile: docker/Dockerfile.service, buildargs: "APP=ai-gateway"}
          - {name: rag-service, context: ".", dockerfile: docker/Dockerfile.service, buildargs: "APP=rag-service"}
          - {name: meeting-summary, context: ".", dockerfile: docker/Dockerfile.service, buildargs: "APP=meeting-summary"}
          - {name: code-task-assistant, context: ".", dockerfile: docker/Dockerfile.service, buildargs: "APP=code-task-assistant"}
          - {name: web, context: ".", dockerfile: docker/Dockerfile.web, buildargs: ""}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.buildargs }}
          tags: |
            ghcr.io/cjx0712/morningstar-ai-collab-${{ matrix.name }}:latest
            ghcr.io/cjx0712/morningstar-ai-collab-${{ matrix.name }}:${{ github.sha }}
      - name: Smoke test - run the published image
        continue-on-error: true
        run: |
          docker run -d --name smoke ghcr.io/cjx0712/morningstar-ai-collab-${{ matrix.name }}:latest || true
          sleep 15
          echo "----- docker ps -----"; docker ps -a || true
          echo "----- container logs -----"; docker logs smoke 2>&1 | tail -30 || true
          docker rm -f smoke || true
      - name: Set package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "users/cjx0712/packages/container/morningstar-ai-collab-${{ matrix.name }}/visibility" -f visibility=public \
            && echo "package is public" || echo "visibility patch failed"
